# =============================================================================
# SEUILS DE VALIDATION : fixés AVANT la première simulation (voir en-tête)
# Chaque contrôle est numéroté comme dans la fiche d'identité (V1 à V8) ;
# V9 (saisonnalité) est l'ajout proposé lors du passage à 24 mois.
# Les intervalles [min, max] sont des [HYPOTHÈSE] larges : motifs classiques des
# données d'achats (Pareto, forte asymétrie), pas des mesures sur une entreprise réelle.
# =============================================================================
validation:
  volumes:
    lignes_bc_par_an: [10000, 20000]          # fiche
    depense_annuelle_eur: [85000000, 115000000]   # ±15 % autour de 100 M€
    part_directs_en_valeur: [0.55, 0.65]      # autour de 60 % (Sievo)
    tolerance_depense_famille: 0.25           # écart relatif toléré entre dépense réalisée et cible, par famille
  V1_concentration:
    gini_depense: [0.60, 0.90]
    part_top10: [0.20, 0.50]
    part_top20pct: [0.60, 0.92]
    part_max_fournisseur: [0.02, 0.12]
  V2_fournisseurs_par_reference:
    part_refs_au_moins_2: [0.40, 0.85]
    part_refs_un_seul: [0.15, 0.60]
    max_part_refs_par_fournisseur: 0.15       # aucun fournisseur ne couvre plus de 15 % des références directes
    max_familles_par_fournisseur: 3
  V3_nombre_fournisseurs:
