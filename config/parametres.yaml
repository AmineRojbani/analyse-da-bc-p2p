# =============================================================================
# PARAMÈTRES DE LA SIMULATION : AutoSys Capteurs SA (entreprise fictive)
# =============================================================================
# Règle de méthode (voir la fiche d'identité) :
#   - Toutes les valeurs de ce fichier, y compris les seuils de la section
#     "validation" tout en bas, sont FIXÉES AVANT la première exécution.
#   - On ne les retouche pas après avoir vu les résultats pour "faire passer"
#     un contrôle. Si un contrôle échoue, on le documente et on décide ensuite
#     (en le justifiant par écrit) de changer ou non un paramètre.
#
# Étiquettes placées en commentaire sur chaque valeur :
#   [SOURCÉ]      valeur issue d'un repère publié (cité dans la fiche)
#   [CHOIX]       décision de conception, pas une mesure
#   [HYPOTHÈSE]   valeur plausible sans source publique trouvée -> à faire
#                 relire par un professionnel des achats / analyse de sensibilité
#   [À CALIBRER]  à comparer à des données réelles (ex. BPI Challenge 2019)
# =============================================================================

meta:
  entreprise: "AutoSys Capteurs SA (fictive)"
  graine: 20261107            # [CHOIX] graine du générateur aléatoire : même graine = mêmes fichiers (contrôle V8)
  debut_periode: "2024-10-01" # [CHOIX] 24 mois pour voir la saisonnalité deux fois
  fin_periode: "2026-09-30"
  date_extraction: "2026-11-04"  # [CHOIX] extraction ~5 semaines après la fin : laisse le temps aux DA récentes d'être converties
  taux_usd_par_eur: 1.08      # [HYPOTHÈSE] taux fixe pour toute la période (simplification)
  inflation_annuelle: 0.02    # [HYPOTHÈSE] hausse annuelle moyenne des prix

export:
  separateur: ";"             # [CHOIX] CSV adapté à Excel / Power BI en français
  decimal: ","
  encodage: "utf-8-sig"
  dossier_sortie: "sorties"

volumes:
  nb_annees: 2                       # [CHOIX]
  achats_annuels_eur: 100000000      # [CHOIX] ordre de grandeur de la fiche (~100 M€ par an)
  part_directs: 0.60                 # [SOURCÉ] médiane Sievo automobile/industrie : 60 % directs / 40 % indirects
  lignes_da_par_an: 16000            # [HYPOTHÈSE] objectif de conception : donne 10 000 à 20 000 lignes de BC par an
  part_lignes_directes: 0.40         # [HYPOTHÈSE] les indirects dominent en nombre de lignes, les directs en valeur

calage:
  # Les montants cibles sont fixés sur la valeur des DA ; une partie ne devient jamais BC (rejet, abandon...),
  # les BC sans DA en ajoutent. Ce coefficient est le rapport attendu valeur BC / valeur DA.
  part_valeur_convertie_attendue: 0.95   # [HYPOTHÈSE] fixé avant simulation, non retouché

structure:
  societe: "1000"
  organisation_achats: "1000"
  sites:                             # [CHOIX] 3 sites, le siège est le plus gros
    "1010": 0.60
    "1020": 0.25
    "1030": 0.15
  groupes_achats:                    # [CHOIX] repris de la fiche : 5 acheteurs
    P10: [ACH_D01, ACH_D02]          # achats directs
    P20: [ACH_M01]                   # pièces de rechange et emballages
    P30: [ACH_S01, ACH_S02]          # informatique, services, logistique

demandeurs:                          # [CHOIX] services demandeurs de la fiche
  departements:
    production:        {n: 8, prefixe: REQ_PROD}
    maintenance:       {n: 5, prefixe: REQ_MAINT}
    logistique:        {n: 4, prefixe: REQ_LOG}
    qualite:           {n: 3, prefixe: REQ_QUAL}
    informatique:      {n: 3, prefixe: REQ_IT}
    services_generaux: {n: 3, prefixe: REQ_SG}
    ingenierie:        {n: 5, prefixe: REQ_ENG}

fournisseurs:
  part_multifamille: 0.08            # [HYPOTHÈSE] part des fournisseurs actifs sur une 2e famille du même type
  ecart_prix_fournisseur: 0.04       # [HYPOTHÈSE] écart-type du niveau de prix propre à chaque fournisseur
  conditions_paiement:               # [HYPOTHÈSE] 30 / 45 / 60 jours (fiche)
    Z030: 0.30
    Z045: 0.40
    Z060: 0.30
  pays_en_dollars: [CN, TW, KR, JP, MY, US]   # [HYPOTHÈSE] fiche : "quelques fournisseurs en dollars (électronique d'Asie)"

articles:
  sigma_popularite: 0.9              # [HYPOTHÈSE] écart de fréquence d'achat entre références (quelques références très commandées)
  concentration_principal: 4.0       # [HYPOTHÈSE] plus la valeur est haute, plus le fournisseur principal pèse sur une référence multi-sources
  sources_max: 5                     # [CHOIX] plafond de fournisseurs qualifiés par référence

saisonnalite:
  # Intensité de création des DA par jour ouvré, selon le mois.
  facteur_mois:                      # [HYPOTHÈSE] calendrier industriel français : fermeture estivale en août, creux fin décembre
    1: 0.95
    2: 1.00
    3: 1.10
    4: 1.00
    5: 0.95
    6: 1.10
    7: 0.90
    8: 0.50
    9: 1.15
    10: 1.10
    11: 1.05
    12: 0.70
  jours_mrp: [0, 3]                  # [HYPOTHÈSE] le MRP tourne le lundi (0) et le jeudi (3)

processus:
  seuils_approbation: [1000, 10000]  # [HYPOTHÈSE, fiche] total de la DA : < 1 000 / 1 000 à 10 000 / > 10 000 euros
  max_lignes_par_da: 8               # [CHOIX]
  approbation:                       # délai en jours ouvrés (médiane, dispersion log-normale) et rejet, par palier
    S1: {mediane_jours: 1.0, sigma: 0.6, max_jours: 15, p_rejet: 0.03}   # [HYPOTHÈSE] [À CALIBRER]
    S2: {mediane_jours: 2.5, sigma: 0.7, max_jours: 25, p_rejet: 0.05}   # [HYPOTHÈSE] [À CALIBRER]
    S3: {mediane_jours: 5.0, sigma: 0.8, max_jours: 40, p_rejet: 0.08}   # [HYPOTHÈSE] [À CALIBRER]
  p_suppression_mrp: 0.04            # [HYPOTHÈSE] DA du MRP supprimées par un nouveau calcul du MRP
  p_abandon_apres_liberation: 0.03   # [HYPOTHÈSE] DA libérées mais jamais commandées
  delai_da_bc:                       # jours ouvrés entre libération (ou création si MRP) et BC
    direct_mrp:     {mediane: 2.0, sigma: 0.7}   # [HYPOTHÈSE] [À CALIBRER] contrats-cadres : commande rapide
    direct_manuel:  {mediane: 4.0, sigma: 0.8}   # [HYPOTHÈSE] [À CALIBRER]
    indirect:       {mediane: 5.0, sigma: 1.0}   # [HYPOTHÈSE] [À CALIBRER]
  file_attente_longue: {proba: 0.05, mediane: 20.0, sigma: 0.6}   # [HYPOTHÈSE] queue longue : certaines lignes attendent des semaines
  delai_max_jours: 90                # [CHOIX]
  p_fractionnement: 0.03             # [HYPOTHÈSE] fiche : "quelques pour cent des lignes"
  p_fractionnement_autre_fournisseur: 0.40   # [HYPOTHÈSE] si la référence a plusieurs fournisseurs qualifiés
  delai_2e_bc: {mediane: 5.0, sigma: 0.7}    # [HYPOTHÈSE] jours ouvrés entre les deux BC d'une DA fractionnée
  p_commande_partielle: 0.02         # [HYPOTHÈSE] DA commandée en partie seulement
  p_fournisseur_souhaite_rempli: {mrp: 0.80, manuel: 0.15}   # [HYPOTHÈSE] champ "fournisseur souhaité" renseigné
  p_fournisseur_different_du_souhaite: 0.10  # [HYPOTHÈSE]

prix:
  bruit_estimation_da: 0.03          # [HYPOTHÈSE] écart-type relatif du prix estimé en DA
  bruit_bc: 0.02                     # [HYPOTHÈSE] écart-type relatif courant du prix de BC
  p_ecart_important: 0.04            # [HYPOTHÈSE] fiche : "de rares écarts importants"
  ecart_important_min: 0.15
  ecart_important_max: 0.50
  p_ecart_important_hausse: 0.65

texte:
  longueur_max: 40                   # [SOURCÉ-SAP] le champ désignation (TXZ01) fait 40 caractères
  p_bruit_libre: 0.25                # [CHOIX] part des textes libres bruités (casse, abréviations, coquilles) : volontaire, pour l'étape de nettoyage
  p_bruit_code: 0.03                 # [CHOIX] idem pour les articles à numéro

